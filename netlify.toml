[build]
  command = "node scripts/prepare-repdb.cjs && node scripts/build-production-vitality.cjs"
  publish = "production-dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/webinar.html"
  to = "/health-hope-live"
  status = 301
  force = true

[[redirects]]
  from = "/webinar"
  to = "/health-hope-live"
  status = 301
  force = true

[[redirects]]
  from = "/webinar-priority.html"
  to = "/health-hope-live"
  status = 301
  force = true

[[redirects]]
  from = "/webinar-priority"
  to = "/health-hope-live"
  status = 301
  force = true

[[redirects]]
  from = "/health-hope-live"
  to = "/health-hope-live.html"
  status = 200

[[headers]]
  for = "/health-hope-live*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/consult*"
  [headers.values]
    Cache-Control = "no-store"


[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/v/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"


[[headers]]
  for = "/js/revitalized-data.js"
  [headers.values]
    Cache-Control = "no-store"


[[headers]]
  for = "/vitality-next.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"


[[headers]]
  for = "/journey/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"


[[headers]]
  for = "/health-profile.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"


[[headers]]
  for = "/member/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[functions."exercise-library"]
  included_files = ["netlify/private-repdb/exercises.json", "netlify/private-repdb/LICENSE-DATA.md"]

[[redirects]]
  from = "/pay/*"
  to = "/pay/index.html"
  status = 200

[[headers]]
  for = "/pay/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/payments/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
