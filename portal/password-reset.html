<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Reset Password | ReVitalized Academy</title>
  <meta name="theme-color" content="#154734">
  <link rel="icon" type="image/png" href="../assets/images/revitalized-icon-approved.png">
  <style>
    :root{--green:#154734;--muted:#66786e;--line:#d7e2db;--bg:#f5f8f6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f7faf8,#eef4f0);font-family:Arial,sans-serif;color:#27463a;padding:24px}
    main{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 28px 80px rgba(21,71,52,.14);text-align:center}
    img{width:74px;height:74px;object-fit:contain;margin-bottom:12px}
    p.kicker{margin:0;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.14em}
    h1{margin:10px 0 10px;font-family:Georgia,serif;font-size:38px;line-height:1.05;font-weight:500;color:#103e2d}
    p.copy{margin:0 auto 24px;max-width:440px;color:var(--muted);font-size:15px;line-height:1.55}
    button{min-height:48px;padding:0 20px;border:1px solid var(--green);border-radius:11px;background:var(--green);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
    .error{margin-top:18px;color:#8f473a;font-size:13px;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <img src="../assets/images/revitalized-icon-approved.png" alt="">
    <p class="kicker">SECURE STAFF ACCESS</p>
    <h1>Reset Your Password</h1>
    <p class="copy">For security, the one-time reset link is not opened until you choose the button below.</p>
    <button id="continue" type="button">Continue to Reset Password</button>
    <p id="error" class="error" hidden></p>
  </main>
  <script>
    (() => {
      const button=document.getElementById("continue");
      const error=document.getElementById("error");
      function decode(value){
        let s=String(value||"").replace(/-/g,"+").replace(/_/g,"/");
        while(s.length%4)s+="=";
        return atob(s);
      }
      button.addEventListener("click",()=>{
        try{
          const encoded=new URLSearchParams(location.search).get("next");
          if(!encoded)throw new Error("This reset link is incomplete.");
          const next=decode(decodeURIComponent(encoded));
          const url=new URL(next);
          if(url.hostname!=="voalfpxiyznnqfcqcymd.supabase.co")throw new Error("This reset link is not valid.");
          location.href=url.toString();
        }catch(e){
          error.hidden=false;
          error.textContent=e?.message||"This password reset link could not be opened.";
        }
      });
    })();
  </script>
</body>
</html>
