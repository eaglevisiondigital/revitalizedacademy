name: Apply enrollment program picker refinement
on:
  push:
    branches: [feature/programs-enrollment-step1-20260909]
    paths: ['.github/workflows/enrollment-program-picker-refinement.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/programs-enrollment-step1-20260909
      - name: Refine program selector structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('enroll.html')
          text=p.read_text()
          old='<link rel="stylesheet" href="css/enrollment82.css?v=82">'
          new=old+'\n  <link rel="stylesheet" href="css/enrollment82-program-picker.css?v=82.1">'
          if old not in text: raise SystemExit('Missing enrollment stylesheet link')
          text=text.replace(old,new,1)
          old_legend='<legend>Which program are you most interested in? <span class="ra-required" aria-hidden="true">*</span></legend>'
          new_legend='''<legend class="ra-program-accessible-legend">Which program are you most interested in? Required.</legend>\n              <div class="ra-program-picker-head">\n                <div class="ra-program-picker-head-copy">\n                  <span class="ra-program-picker-kicker">Your starting point</span>\n                  <h3>Which path feels closest to where you want to begin?</h3>\n                </div>\n                <span class="ra-program-picker-note">No final commitment yet</span>\n                <p>Choose the program that interests you most today. This simply helps the ReVitalized team understand your preferred starting point; you can still change direction after talking with a coach.</p>\n              </div>'''
          if old_legend not in text: raise SystemExit('Missing old program legend')
          text=text.replace(old_legend,new_legend,1)
          old_help='<div class="ra-program-help"><span>You are not locking yourself into a package here.</span><a href="plans.html" target="_blank" rel="noopener">Compare every program and what is included →</a></div>'
          new_help='<div class="ra-program-help"><span>Not sure? Choose the final option below and the team can guide you.</span><a href="plans.html" target="_blank" rel="noopener">Compare programs and everything included →</a></div>'
          if old_help not in text: raise SystemExit('Missing old program helper')
          text=text.replace(old_help,new_help,1)
          p.write_text(text)

          test=Path('tests/enrollment82.cjs')
          t=test.read_text()
          anchor="assert(css.includes('--ra-gold:#b18845'), 'Approved gold styling missing');"
          addition=anchor+"\nassert(enroll.includes('css/enrollment82-program-picker.css?v=82.1'), 'Premium program picker stylesheet missing');\nassert(enroll.includes('Which path feels closest to where you want to begin?'), 'Premium program picker heading missing');\nassert(fs.existsSync('css/enrollment82-program-picker.css'), 'Program picker refinement CSS missing');"
          if anchor not in t: raise SystemExit('Missing test anchor')
          test.write_text(t.replace(anchor,addition,1))
          PY
      - name: Run enrollment checks
        run: node tests/enrollment82.cjs
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enroll.html tests/enrollment82.cjs
          git commit -m "Refine enrollment program selector hierarchy and layout"
          git push origin HEAD:feature/programs-enrollment-step1-20260909
