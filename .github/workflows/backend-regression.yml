name: Backend and public regression gate
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RVA_TEST_PGHOST: 127.0.0.1
      RVA_TEST_PGPORT: 5432
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:js
      - run: npm run test:backend
      - run: node --test tests/staging/*.test.cjs
      - run: npx --yes --package=deno@2.9.6 deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: npx --yes --package=deno@2.9.6 deno test --frozen --config supabase/functions/deno.json tests/edge/
