name: Verify original-portrait Founders hero
on:
  push:
    branches: [fix/founders110-original-portrait]
    paths: [tools/founders110.ready]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founders110-original-portrait
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble verified artwork and replace only the hero
        run: python tools/founders110-build.py
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Test desktop and mobile
        run: python tools/founders110-test.py
      - name: Save screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founders110-verified
          path: founders110-qa/
      - name: Commit only verified implementation on the isolated branch
        run: |
          git config user.name 'eaglevisiondigital'
          git config user.email '309751709+eaglevisiondigital@users.noreply.github.com'
          git add -- founders.html css/founders110.css assets/images/founders110-background.webp
          git commit -m 'Build 110: replace About hero with original portrait layers'
          git push origin HEAD:fix/founders110-original-portrait
