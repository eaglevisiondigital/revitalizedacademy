name: B5.2 offline release contracts
on:
  pull_request:
    paths: ['scripts/b52/**', 'tests/b52-release-contract.cjs', 'docs/evidence/b52/**', '.github/workflows/b52-release-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22.23.3', '24.20.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - run: node --test tests/b52-release-contract.cjs
