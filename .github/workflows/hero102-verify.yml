name: Hero 102 verification
on:
  push:
    branches: [main, hero102-approved-portrait]
    paths:
      - index.html
      - css/hero102-portrait.css
      - assets/images/justyn-elle-professional-approved-102.png
      - tests/hero102_visual.py
      - .github/workflows/hero102-verify.yml
permissions:
  contents: read
jobs:
  hero-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification runtime
        run: |
          pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify original portrait and unchanged page content
        run: python tests/hero102_visual.py
      - name: Verify published homepage
        if: github.ref == 'refs/heads/main'
        env:
          HERO_LIVE_URL: https://revitalizedacademy.netlify.app
        run: python tests/hero102_visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero102-browser-verification
          path: artifacts/hero102/
          retention-days: 7
