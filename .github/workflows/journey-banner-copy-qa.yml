name: Journey banner copy QA
on:
  push:
    branches: [fix/journey-banner-copy-20260909]
    paths: ['.github/workflows/journey-banner-copy-qa.yml']
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the supplied journey banner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          p = Path('index.html')
          original = p.read_bytes()
          assert blob_sha(original) == '00001bb1b7d5a652d40afa1c9972fc7ce7804438', 'Homepage changed; stop rather than overwrite.'
          text = original.decode('utf-8')
          start = text.index('    <section class="journey-banner section-border">')
          end = text.index('    </section>', start) + len('    </section>')
          old = text[start:end]
          new = old.replace('Your health journey does not need to wait for what’s next.', 'Your health journey does not need to wait for the “next big thing”.').replace('Everything you need to begin is already here.', 'The principles of health have worked the whole time.').replace('The coaching, knowledge, personalized guidance and accountability are in place today. The new tools being added around that foundation simply make the experience even stronger.', 'The coaching, knowledge, personalized guidance and accountability have already worked for families just like yours. The modern tools we are building around that foundation simply make the experience even better.').replace('<a class="btn btn-primary journey-secondary-cta" href="enroll.html">Start Your Journey</a>', '<a class="btn btn-primary vitality-primary-cta" href="consult.html">Get Your Vitality Report</a>')
          updated = (text[:start] + new + text[end:]).encode('utf-8')
          assert blob_sha(updated) == '6213dff8c49e7525dc2b323a398552ea89c43dd0', 'Unexpected output.'
          assert text[:start] == updated.decode('utf-8')[:start]
          assert text[end:] == updated.decode('utf-8')[start + len(new):]
          assert new.count('href="consult.html"') == 2
          for path, sha in {'css/styles.css':'934d58c1aa16a83927d966a278ebb9c1cfd48b99', 'css/vitality55.css':'fc772acb29cef8fb832b8c6ee6b113b1f917c923', 'css/hero54.css':'cca53317e8bf534cbbfda10f3adf12023add2ee9', 'css/coaching76.css':'e5c10325abe663ddfc3269194c5646dcef80b46f', 'css/webinar81.css':'0fe235b4626781665d3a9f36dc152ceeef055969'}.items():
              assert blob_sha(Path(path).read_bytes()) == sha, f'Recheck layout against changed stylesheet: {path}'
          p.write_bytes(updated)
          print(new)
          print('Updated index blob:', blob_sha(updated))
          PY
      - name: Run the existing assessment regression suite
        run: |
          npm install --prefix "$RUNNER_TEMP/assessment-tests" --no-save --no-package-lock jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/assessment-tests/node_modules" node --test tests/assessment-person.cjs
      - name: Commit only the approved banner update and remove this temporary workflow
        run: |
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/journey-banner-copy-qa.yml
          git commit -m "Apply approved journey banner text and vitality report CTA"
          git push origin HEAD:fix/journey-banner-copy-20260909
