name: Matrix popup copy QA
on:
  push:
    branches: [fix/matrix-popup-descriptions-20260909]
    paths: ['.github/workflows/matrix-popup-copy-qa.yml']
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the approved popup descriptions only
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re
          def blob_sha(p):
              b = p.read_bytes()
              return hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()
          for rel, expected in {'index.html':'8d384a4b34f8e962c5d5b9897e864dd87e5e5362', 'js/app.js':'6f48dd4cd436a7614dd5e313fb0d9088129c13e0'}.items():
              assert blob_sha(Path(rel)) == expected, f'Unexpected source content: {rel}'
          sections = {
              'energized': [
                  ['Cellular Hydration','hydration','Get your body consistently hydrated to support mental energy and better circulation.'],
                  ['Systemic Detoxification','detox','Open up your drainage pathways to cleanse built-up toxins and relieve internal stress.'],
                  ['Electrobiology Rhythms','habits','Align your body electrically to support restorative sleep and healthy hormone balance.']
              ],
              'organized': [
                  ['Wise Budgeting','budgeting','Create peace of mind with a thoughtful health budget planned for your family’s unique needs.'],
                  ['Mentality Realignment','mindset','Get proactive with your health education so that you can become self-reliant with your family’s health and not at the mercy of online marketing.'],
                  ['Momentum Regimens','momentum','Take back control over the direction of your health by implementing holistic practices into your lifestyle so health becomes natural and effective.']
              ],
              'athletic': [
                  ['A Living Diet','diet','Create a whole food diet that fully nourishes your body while still tasting delicious and not trapping you in the kitchen.'],
                  ['Functional Training','training','Use functional exercises aligned to your body’s natural movement to build lean muscle, get stronger, and move more dynamically.'],
                  ['Holistic Recovery','recovery','Support your body to recover faster and more effectively from physical activity to get past aches and pains.']
              ],
              'refined': [
                  ['G.I. Renovation','gi','Improve your digestion and overall feeling of your gut by fixing bowel transit rate and building up a strong gut microbiome.'],
                  ['Hormone Balancing','hormone','Get back in control of your hormones by reducing disruptors in your home and getting rid of stubborn fat.'],
                  ['Neural Repatterning','neural','Train your brain to think faster and remember better as you learn to manage stress and regulate brain chemicals.']
              ]
          }
          p=Path('js/app.js'); source=p.read_text(); original=source
          for key, entries in sections.items():
              pattern=rf'(  {key}: \{{[\s\S]*?    sections: \[\n)([\s\S]*?)(\n    \]\n  \}})'
              match=re.search(pattern,source)
              assert match is not None, key
              assert len(re.findall(r"        title: '",match[2]))==3, key
              blocks=[]
              for title,icon,description in entries:
                  assert "'" not in title+icon+description
                  blocks.append("      {\n        title: '"+title+"',\n        icon: '"+icon+"',\n        points: [\n          '"+description+"'\n        ]\n      }")
              source=source[:match.start(2)]+',\n'.join(blocks)+source[match.end(2):]
          old="    tagline: 'Be impressed with your reflection',"
          new="    tagline: 'Get impressed with who you see in the mirror',"
          assert source.count(old)==1
          source=source.replace(old,new,1)
          def surrounding(s):
              a=s.index('const matrixData = {'); b=s.index('\nconst matrixNodes = ',a)
              return s[:a],s[b:]
          assert surrounding(source)==surrounding(original)
          p.write_text(source)
          p=Path('index.html');source=p.read_text()
          old='js/app.js?v=matrix-copy-20260909';new='js/app.js?v=matrix-popups-20260909'
          assert source.count(old)==1
          p.write_text(source.replace(old,new,1))
          for rel, expected in {'index.html':'00001bb1b7d5a652d40afa1c9972fc7ce7804438','js/app.js':'7737054caeb1194f3bae42891d9df9d78b9edc52'}.items():
              assert blob_sha(Path(rel))==expected, rel
              print(rel,blob_sha(Path(rel)))
      - name: Validate JavaScript and the existing assessment regression suite
        run: |
          node --check js/app.js
          npm install --prefix "$RUNNER_TEMP/matrix-popup-tests" --no-audit --no-fund jsdom@26
          NODE_PATH="$RUNNER_TEMP/matrix-popup-tests/node_modules" node --test tests/assessment-person.cjs
      - name: Commit only the approved changes and remove this temporary workflow
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'index.html','js/app.js'}, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/matrix-popup-copy-qa.yml
          git add index.html js/app.js
          git commit -m "Apply client-approved Matrix popup copy while preserving unchanged headings"
          git push origin HEAD:fix/matrix-popup-descriptions-20260909
