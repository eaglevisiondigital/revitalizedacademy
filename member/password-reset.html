<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <script src="/runtime-config.js"></script><script src="/js/environment.js"></script><title>Reset Member Password | ReVitalized Academy</title>
  <meta name="theme-color" content="#154734">
  <link rel="icon" type="image/png" href="../assets/images/revitalized-icon-approved.png">
  <style>
    :root{--green:#154734;--muted:#66786e;--line:#d7e2db;--danger:#9a4b3c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f7faf8,#eef4f0);font-family:Arial,sans-serif;color:#27463a;padding:24px}
    main{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 28px 80px rgba(21,71,52,.14)}
    .brand{text-align:center}.brand img{width:74px;height:74px;object-fit:contain;margin-bottom:12px}.kicker{margin:0;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.14em}
    h1{margin:10px 0 10px;font-family:Georgia,serif;font-size:38px;line-height:1.05;font-weight:500;color:#103e2d;text-align:center}.copy{margin:0 auto 24px;max-width:440px;color:var(--muted);font-size:15px;line-height:1.55;text-align:center}
    .panel{display:grid;gap:14px}label{display:grid;gap:6px}label span{font-size:12px;font-weight:800;color:#52675b}input{height:48px;border:1px solid #cbd9d1;border-radius:10px;padding:0 12px;font:inherit;color:#28483a}input:focus{outline:none;border-color:#7da78f;box-shadow:0 0 0 3px rgba(21,71,52,.08)}
    button{min-height:48px;padding:0 20px;border:1px solid var(--green);border-radius:11px;background:var(--green);color:#fff;font-size:14px;font-weight:800;cursor:pointer}.status{margin:2px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--green)}.hidden{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="../assets/images/revitalized-icon-approved.png" alt="">
      <p class="kicker">SECURE MEMBER ACCESS</p>
    </div>
    <section id="loading-panel" class="panel">
      <h1>Reset Your Password</h1>
      <p class="copy">Verifying your secure password reset link...</p>
      <p id="loading-status" class="status" aria-live="polite"></p>
    </section>
    <section id="password-panel" class="panel hidden">
      <h1>Choose a New Password</h1>
      <p class="copy">Enter and confirm your new password. After it is saved, you’ll return to Member Access to sign in.</p>
      <form id="reset-form" class="panel">
        <label><span>New Password</span><input id="new-password" type="password" minlength="10" autocomplete="new-password" required></label>
        <label><span>Confirm New Password</span><input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button type="submit">Save New Password</button>
        <p id="reset-status" class="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    (()=>{
      const client=window.supabase.createClient(window.RVA_ENV.supabaseUrl,window.RVA_ENV.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"rva-member-password-recovery"}});
      const loading=document.getElementById("loading-panel"),passwordPanel=document.getElementById("password-panel"),loadingStatus=document.getElementById("loading-status"),resetStatus=document.getElementById("reset-status"),form=document.getElementById("reset-form");
      let recoverySessionPromise=null,resetReady=false;
      function status(target,message,type=""){target.textContent=message||"";target.className="status"+(type?" "+type:"");}
      async function establishRecoverySession(){
        const hash=new URLSearchParams(location.hash.replace(/^#/,""));
        const errorDescription=hash.get("error_description");
        if(errorDescription)throw new Error(decodeURIComponent(errorDescription));
        const query=new URLSearchParams(location.search),tokenHash=query.get("token_hash");
        if(tokenHash){
          history.replaceState({},document.title,location.pathname);
          const {data,error}=await client.auth.verifyOtp({token_hash:tokenHash,type:"recovery"});
          if(error||!data?.session)throw error||new Error("Recovery session unavailable");
          return data.session;
        }
        throw new Error("Recovery credential unavailable");
      }
      async function showResetIfReady(){
        if(resetReady)return;
        if(!recoverySessionPromise)recoverySessionPromise=establishRecoverySession();
        try{await recoverySessionPromise;}catch{status(loadingStatus,"This reset link is invalid, expired, or has already been used. Request a new reset email from Member Access.","error");return;}
        resetReady=true;history.replaceState({},document.title,location.pathname);loading.classList.add("hidden");passwordPanel.classList.remove("hidden");document.getElementById("new-password").focus();
      }
      client.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"||event==="SIGNED_IN")window.setTimeout(showResetIfReady,0);});
      window.setTimeout(showResetIfReady,150);
      form.addEventListener("submit",async(event)=>{
        event.preventDefault();
        if (!resetReady) return;
        const password=document.getElementById("new-password").value,confirm=document.getElementById("confirm-password").value;
        if(password.length<10){status(resetStatus,"Use at least 10 characters for your password.","error");return;}
        if(password!==confirm){status(resetStatus,"The passwords do not match.","error");return;}
        status(resetStatus,"Saving your new password...");
        const submit=form.querySelector("button");if(submit.disabled)return;submit.disabled=true;const {error}=await client.auth.updateUser({password});
        if(error){submit.disabled=false;status(resetStatus,error.message,"error");return;}
        form.reset();await client.auth.signOut({scope:"local"});status(resetStatus,"Password changed successfully. Return to Member Access and sign in with your new password.","success");
        window.setTimeout(()=>location.replace("/member/"),700);
      });
    })();
  </script>
</body>
</html>
